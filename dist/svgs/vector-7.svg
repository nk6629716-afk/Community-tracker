<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 90" fill="none">
  <!-- Vector 7: Crossroads / 3-way branching arrows -->
  <!-- Horizontal approach curving up to intersection -->
  <path
    d="M 10 68 L 38 68 C 50 68 54 56 54 50"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Upward branch -->
  <path
    d="M 54 50 L 54 22"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M 50 24 L 54 16 L 58 24 Z"
    fill="currentColor"
  />

  <!-- Rightward branch -->
  <path
    d="M 54 50 Q 56 36 72 36 L 96 36"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M 94 32 L 102 36 L 94 40 Z"
    fill="currentColor"
  />

  <!-- Downward branch -->
  <path
    d="M 54 50 Q 56 60 74 60 L 74 72"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M 70 70 L 74 78 L 78 70 Z"
    fill="currentColor"
  />

  <!-- Central Intersection Node -->
  <circle cx="54" cy="50" r="5" fill="currentColor" />
</svg>
